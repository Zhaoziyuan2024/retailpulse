[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse-ba"
version = "0.1.0"
description = "Reproducible retail customer analytics and temporal repurchase evaluation"
requires-python = ">=3.11"
dependencies = ["pandas>=2.2,<4", "numpy>=2,<3", "scikit-learn>=1.5,<2", "openpyxl>=3.1,<4", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
retailpulse = "retailpulse.cli:main"

[tool.setuptools.packages.find]
include = ["retailpulse*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
